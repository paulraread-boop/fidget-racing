name: Fidget Racing B439 APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fidget-b431-apk.yml'
      - 'Fidget_Racing_B431_Game_Source-1.zip'
      - 'b432_layout_fix.py'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install B431 game from uploaded ZIP
        run: |
          set -e
          unzip -p Fidget_Racing_B431_Game_Source-1.zip index.html > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          grep -qi 'html' app/src/main/assets/index.html
          sed -i "s/versionCode 435; versionName '435'/versionCode 444; versionName 'B439'/" app/build.gradle
      - name: Inspect full source and preserve Showroom
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          current=Path('app/src/main/assets/index.html').read_text(errors='replace')
          for word in ['showroom','garage','gallery','concept','pick your field']:
              print('CURRENT',word,current.lower().count(word))
          for name in ['Fidget-Racing-V429-Part-1.zip','Fidget-Racing-V429-Part-2.zip','Fidget-Racing-V429-Part-3.zip','FIDGET_RACING_APPROVED_ANDROID_SOURCE-1.zip','Fidget_Racing_Build_430_Source-3.zip']:
              with zipfile.ZipFile(name) as z:
                  print('ARCHIVE',name,[(i.filename,i.file_size) for i in z.infolist()[:15]])
                  for i in z.infolist():
                      if i.filename.lower().endswith(('.html','.js')) and i.file_size<50000000:
                          data=z.read(i).decode('utf-8','replace').lower()
                          print('SOURCE',name,i.filename,'showroom',data.count('showroom'),'gallery',data.count('gallery'),'concept',data.count('concept'))
          PY
      - name: Diagnose showroom navigation and missing helmets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text(errors='replace')
          for term in ['showroom','helmet','gallery','concept']:
              matches=list(re.finditer(term,s,re.I))
              print('===== TERM',term,'count',len(matches),'=====')
              for m in matches[:24]:
                  a=max(0,m.start()-160);b=min(len(s),m.end()+200)
                  print(repr(s[a:b])[:420])
          PY
      - name: Restore original car and helmet artwork assets
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          root=Path('app/src/main/assets')
          archive='Fidget-Racing-V429-Part-2.zip'
          with ZipFile(archive) as z:
              for item in z.infolist():
                  if item.is_dir(): continue
                  if not item.filename.startswith('app/src/main/assets/assets/'): continue
                  relative=Path(item.filename).relative_to('app/src/main/assets')
                  target=root/relative
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(item))
                  print('RESTORED',relative,target.stat().st_size)
          html=(root/'index.html').read_text(encoding='utf-8')
          references=sorted(set(re.findall(r'(?:assets/)[a-zA-Z0-9_.-]+\\.(?:png|jpe?g|webp)',html,re.I)))
          print('IMAGE REFERENCES',references)
          for ref in references:
              print('ASSET',ref,'present' if (root/ref).exists() else 'missing')
          print('RESTORED ARTWORK FILES',len(list((root/'assets').glob('*'))))
          assert len(list((root/'assets').glob('*')))>=9,'Expected original showroom and paint assets'
          PY
      - name: Apply B439 layout-only repair
        run: python3 b432_layout_fix.py
      - name: Create missing Android launcher icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import io, zipfile, re, base64
          game = Path('app/src/main/assets/index.html').read_text(errors='replace')
          image = None
          for pattern in [r'data:image/(?:jpeg|png);base64,([A-Za-z0-9+/=]+)']:
              for m in re.finditer(pattern, game):
                  try:
                      candidate = Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert('RGB')
                      if candidate.width >= 128 and candidate.height >= 128:
                          image = candidate
                          break
                  except Exception:
                      pass
              if image: break
          if image is None:
              image = Image.new('RGB',(512,512),'#151820')
              draw=ImageDraw.Draw(image)
              draw.ellipse((60,110,450,410),fill='#f3c21b',outline='#f25d28',width=14)
              draw.text((185,205),'14',fill='black',font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',110))
          side=min(image.size)
          x=(image.width-side)//2; y=(image.height-side)//2
          image=image.crop((x,y,x+side,y+side))
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              dest=Path('app/src/main/res/mipmap-'+density)
              dest.mkdir(parents=True,exist_ok=True)
              image.resize((size,size),Image.Resampling.LANCZOS).save(dest/'ic_launcher.png')
          PY
      - name: Build B439 APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Fidget-Racing-B439-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package complete game source and APK
        run: |
          set -e
          mkdir -p final-backup
          cp app/build/outputs/apk/debug/*.apk final-backup/Fidget-Racing-B439-debug.apk
          cat > final-backup/README-START-HERE.txt <<'EOF'
          FIDGET RACING - B439 FINAL NIGHT BACKUP
          This ZIP contains the complete Android project source, the installed game
          HTML and assets, GitHub Actions workflows, and the compiled debug APK.
          Keep this ZIP safe and upload it tomorrow to continue without rebuilding
          the source from scratch.
          APK: Fidget-Racing-B439-debug.apk
          Music: original audio retained; requested Liquid Flame copy not yet applied.
          To rebuild: gradle :app:assembleDebug (Java 17, Android SDK required).
          EOF
          zip -q -r final-backup/Fidget-Racing-B439-COMPLETE-PROJECT.zip . -x '.git/*' '.gradle/*' '*/build/*' 'final-backup/*' '*.apk'
          unzip -tqq final-backup/Fidget-Racing-B439-COMPLETE-PROJECT.zip
          unzip -l final-backup/Fidget-Racing-B439-COMPLETE-PROJECT.zip | grep -q 'app/src/main/assets/index.html'
          unzip -l final-backup/Fidget-Racing-B439-COMPLETE-PROJECT.zip | grep -q 'app/build.gradle'
          cp final-backup/Fidget-Racing-B439-debug.apk final-backup/game.apk
          cd final-backup
          zip -q -u Fidget-Racing-B439-COMPLETE-PROJECT.zip game.apk
          rm game.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Fidget-Racing-B439-COMPLETE-PROJECT-ZIP
          path: |
            final-backup/Fidget-Racing-B439-COMPLETE-PROJECT.zip
            final-backup/README-START-HERE.txt
          if-no-files-found: error
          retention-days: 90
