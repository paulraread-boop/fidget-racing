name: Build Fidget Racing Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'FIDGET_RACING_APPROVED_ANDROID_SOURCE*.zip'
      - 'FIDGET_RACING_RESTORED_QUICK_RACE_MENU*.html'
      - '.github/workflows/build-android.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack approved project
        run: |
          mkdir -p android-project
          unzip -q 'FIDGET_RACING_APPROVED_ANDROID_SOURCE-1.zip' -d android-project
      - name: Include latest approved playable game
        run: |
          test -s FIDGET_RACING_RESTORED_QUICK_RACE_MENU-2.html
          cp FIDGET_RACING_RESTORED_QUICK_RACE_MENU-2.html android-project/app/src/main/assets/index.html
      - name: Build debug APK and unsigned release bundle
        working-directory: android-project
        run: gradle --no-daemon assembleDebug bundleRelease
      - name: Verify Android download files
        run: |
          find android-project/app/build/outputs -type f
          test -n "$(find android-project/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: Fidget-Racing-Android-APK
          if-no-files-found: error
          retention-days: 30
          path: |
            android-project/app/build/outputs/apk/debug/*.apk
            android-project/app/build/outputs/bundle/release/*.aab
