name: Build Fidget Racing Android V426
# Approved faster-AI build; yellow #14 icon from embedded artwork
on:
  workflow_dispatch:
    inputs:
      game_file:
        description: 'Approved game HTML to package (must exist in repository root)'
        required: true
        default: 'V426_Part_1_Game_HTML.zip'
        type: string
  push:
    paths:
      - 'FIDGET_RACING_APPROVED_ANDROID_SOURCE*.zip'
      - 'FIDGET_RACING_EXIT_FIXED_SOURCE.zip'
      - 'Fidget_Racing_APK_Inspection_Preview.html'
      - 'FIDGET_RACING_RESTORED_QUICK_RACE_MENU*.html'
      - 'FIDGET_RACING_LATEST_APPROVED_FASTER_AI_OCT18-4.html'
      - 'android_new_menu_chat.py'
      - 'android_menu_repair.py'
      - 'android_background_exit_repair.py'
      - 'android_rollover_visual_test.py'
      - '.github/workflows/build-android.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack approved project
        run: |
          mkdir -p android-project
          unzip -q 'FIDGET_RACING_EXIT_FIXED_SOURCE.zip' -d android-project
      - name: Assemble V426 game and image assets
        run: |
          mkdir -p android-project/app/src/main/assets
          unzip -oq V426_Part_1_Game_HTML.zip -d android-project/app/src/main/assets
          unzip -oq V426_Part_2_Images_A.zip -d android-project/app/src/main/assets
          unzip -oq V426_Part_3_Images_B.zip -d android-project/app/src/main/assets
          test -s android-project/app/src/main/assets/index.html
          test "$(find android-project/app/src/main/assets/assets -type f | wc -l)" -eq 9
      - name: Restore previously working landscape auto-fit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-project/app/src/main/assets/index.html')
          html=p.read_text()
          script="""<script>
          (function () {
            function fitGame() {
              var b = document.body;
              if (!b) return;
              b.style.zoom = '1';
              var vw = document.documentElement.clientWidth;
              var vh = document.documentElement.clientHeight;
              var w = Math.max(b.scrollWidth, document.documentElement.scrollWidth);
              var h = Math.max(b.scrollHeight, document.documentElement.scrollHeight);
              var scale = Math.min(1, vw / Math.max(1, w), vh / Math.max(1, h));
              b.style.zoom = String(Math.max(0.4, scale));
            }
            window.addEventListener('load', fitGame);
            window.addEventListener('resize', fitGame);
            window.addEventListener('orientationchange', fitGame);
            document.addEventListener('DOMContentLoaded', fitGame);
          })();
          </script>"""
          if '</body>' in html: html=html.replace('</body>',script+'</body>',1)
          elif '</BODY>' in html: html=html.replace('</BODY>',script+'</BODY>',1)
          else: raise SystemExit('Cannot find closing body tag for known-good fit script')
          p.write_text(html)
          print('Restored auto-fit from October 26 approved build')
          PY
      - name: Install approved Fidget Racing cover as app icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source=Path('fidget-racing-cover-1.jpg')
          if not source.is_file(): raise SystemExit('Approved app icon missing')
          im=Image.open(source).convert('RGB')
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              out=Path('android-project/app/src/main/res')/('mipmap-'+density)
              out.mkdir(parents=True,exist_ok=True)
              im.resize((size,size)).save(out/'ic_launcher.png')
          manifest=Path('android-project/app/src/main/AndroidManifest.xml')
          content=manifest.read_text()
          if 'android:icon=' not in content:
              content=content.replace('<application','<application android:icon="@mipmap/ic_launcher"',1)
              manifest.write_text(content)
          PY
      - name: Build debug APK and unsigned release bundle
        working-directory: android-project
        run: gradle --no-daemon assembleDebug bundleRelease
      - name: Verify Android download files
        run: |
          find android-project/app/build/outputs -type f
          test -n "$(find android-project/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: Fidget-Racing-Android-APK
          if-no-files-found: error
          retention-days: 30
          path: |
            android-project/app/build/outputs/apk/debug/*.apk
            android-project/app/build/outputs/bundle/release/*.aab
