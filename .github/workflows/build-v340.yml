name: Build Fidget Racing V340 Android
on:
  workflow_dispatch:
  push:
    branches: [build/v340-android]
    paths:
      - 'android-v340/**'
      - 'Fidget_V340_Upload_*.zip'
      - '.github/workflows/build-v340.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner already includes Android SDK command-line tools.
      # Avoid setup-android's failing SDK license/update operation.
      - name: Locate preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME" || { echo "::error::Android SDK missing on runner"; exit 1; }
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "Using Android SDK: $ANDROID_HOME"
      - name: Unpack uploaded V340 Android project
        run: |
          if [ ! -f android-v340/app/build.gradle ]; then
            for i in 1 2 3 4 5; do
              test -f "Fidget_V340_Upload_${i}.zip"
              unzip -q "Fidget_V340_Upload_${i}.zip" -d "$RUNNER_TEMP"
            done
            cat "$RUNNER_TEMP"/Fidget_V340_Android_Part_{1,2,3,4,5}.zip.part > "$RUNNER_TEMP/v340.zip"
            unzip -q "$RUNNER_TEMP/v340.zip"
          fi
      - name: Verify V340 source is present
        run: |
          test -f android-v340/app/src/main/assets/index.html || { echo "::error::Upload the V340 Android Studio source into android-v340/ first"; exit 1; }
          test -f android-v340/app/build.gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Add explicit steering-side chooser and approved launcher artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import base64
          html = Path('android-v340/app/src/main/assets/index.html')
          source = html.read_text(encoding='utf-8')
          # Keep the game's original steering control implementation intact.
          # Replace its menu interaction with an explicit Left/Right chooser.
          marker = '</body>'
          if marker not in source:
              raise SystemExit('HTML body closing tag not found')
          chooser = r"""
          <style>
          #v340-steering-chooser{position:fixed;inset:0;z-index:2147483646;display:none;align-items:center;justify-content:center;background:rgba(0,8,23,.78)}
          #v340-steering-chooser .steering-panel{width:min(520px,90vw);padding:22px;border:2px solid #48d9ff;border-radius:18px;background:#081b32;color:white;text-align:center;box-shadow:0 0 32px #1ba9ee80;font:700 20px system-ui,sans-serif}
          #v340-steering-chooser .steering-choices{display:flex;gap:12px;margin-top:18px}
          #v340-steering-chooser button{flex:1;min-height:64px;border:2px solid #64e5ff;border-radius:12px;background:linear-gradient(120deg,#13afd5,#6545d9);color:white;font:700 22px system-ui,sans-serif}
          #v340-steering-chooser button[aria-pressed=true]{border-color:#ffda66;box-shadow:0 0 0 2px #ffda66}
          #v340-steering-chooser .steering-cancel{margin-top:12px;min-height:40px;font-size:15px;background:#19334d}
          </style>
          <div id="v340-steering-chooser" role="dialog" aria-modal="true" aria-label="Choose steering side">
            <div class="steering-panel">
              <div>CHOOSE STEERING SIDE</div>
              <div class="steering-choices">
                <button type="button" data-side="left">LEFT</button>
                <button type="button" data-side="right">RIGHT</button>
              </div>
              <button type="button" class="steering-cancel" data-side="cancel">CANCEL</button>
            </div>
          </div>
          <script>
          (function(){
            var chooser=document.getElementById('v340-steering-chooser');
            var side=document.getElementById('side');
            if(!chooser||!side){console.error('V340 steering chooser: steering control missing');return;}
            function selectedRight(){return /right/i.test(side.textContent||'');}
            function show(){
              chooser.style.display='flex';
              chooser.querySelector('[data-side=left]').setAttribute('aria-pressed',String(!selectedRight()));
              chooser.querySelector('[data-side=right]').setAttribute('aria-pressed',String(selectedRight()));
            }
            // Capture before the existing toggle and any menu-dismiss handler.
            side.addEventListener('click',function(e){
              e.preventDefault();e.stopImmediatePropagation();e.stopPropagation();show();
            },true);
            chooser.addEventListener('click',function(e){
              e.stopPropagation();
              var choice=e.target.closest('[data-side]');
              if(!choice)return;
              var requested=choice.getAttribute('data-side');
              if(requested!=='cancel' && selectedRight()!==(requested==='right')){
                // Invoke the original game steering logic only if a change is needed.
                if(typeof side.onclick==='function')side.onclick.call(side,{
                  preventDefault:function(){},stopPropagation:function(){}
                });
              }
              chooser.style.display='none';
            });
          })();
          </script>
          """
          source = source.replace(marker, chooser + marker, 1)
          # Retire temporary V319/V335 tester giveaways; preserve legitimate earnings.
          import re
          for version in ('319', '335'):
              begin = source.find('// V' + version + ': one-time +')
              if begin < 0:
                  raise SystemExit('Missing V' + version + ' temporary bonus block')
              finish = source.find('} catch(e) {}', begin)
              if finish < 0 or finish - begin > 750:
                  raise SystemExit('Cannot safely locate V' + version + ' bonus end')
              source = source[:begin] + source[finish + len('} catch(e) {}'):]
          # Remove only the historic test giveaways from saved accounts.
          correction = """
          try {
            const done='fidget-v340-test-grants-reversed';
            if(localStorage.getItem(done)!=='yes'){
              let deduction=0;
              if(localStorage.getItem('fidget-v319-test-20000-granted')==='yes')deduction+=20000;
              if(localStorage.getItem('fidget-v335-test-40000-granted')==='yes')deduction+=40000;
              if(deduction){
                const current=Math.max(0,Number(localStorage.getItem('fidgetCredits'))||0);
                localStorage.setItem('fidgetCredits',String(Math.max(0,current-deduction)));
              }
              localStorage.setItem(done,'yes');
            }
          } catch(e) {console.error('V340 test credits correction',e)}
          """
          anchor = '// V307 release wallet: grant 2,500 RC once to new players only.'
          if anchor not in source:
              raise SystemExit('Wallet initialization not found')
          source = source.replace(anchor, correction + anchor, 1)
          # Use the existing replay exit action; label it clearly for testers.
          old_return = '<button data-r="exit">↩ RESULTS</button>'
          new_return = '<button data-r="exit">↩ RETURN TO RESULTS</button>'
          if source.count(old_return) != 1:
              raise SystemExit('Replay return control not found; refusing unrelated changes')
          source = source.replace(old_return, new_return, 1)
          # Raise only slower and middle AI tiers by 1%; leave fastest unchanged.
          old_tiers = '[0.9494,0.952,0.965][c.aiTuningTier]'
          new_tiers = '[0.958894,0.96152,0.965][c.aiTuningTier]'
          if source.count(old_tiers) != 1:
              raise SystemExit('AI tuning tiers not found uniquely; refusing unrelated changes')
          source = source.replace(old_tiers, new_tiers, 1)
          # V340 replay: compact controls, no live racing touch buttons, one replay entry.
          replay_style = """
          <style id="v340-replay-cleanup">
          body.v175-replay-view #gameMenuItems,
          body.v175-replay-view #positionTest,
          body.v175-replay-view .telemetry,
          body.v175-replay-view .touch-controls,
          body.v175-replay-view .touchControls,
          body.v175-replay-view .race-controls,
          body.v175-replay-view .controls,
          body.v175-replay-view .pedals,
          body.v175-replay-view #gas,
          body.v175-replay-view #boost,
          body.v175-replay-view #knob,
          body.v175-replay-view #board {display:none!important;pointer-events:none!important}
          body.v175-replay-view #replay162Panel{
            top:4px!important;right:8px!important;left:auto!important;
            max-width:min(76vw,540px)!important;width:auto!important;
            padding:3px 6px!important;gap:3px!important;
            font-size:10px!important;line-height:1.15!important;
            background:#07152ed9!important
          }
          body.v175-replay-view #replay162Panel button{
            font-size:10px!important;padding:3px 6px!important;min-height:25px!important
          }
          </style>
          """
          if '</head>' not in source:
              raise SystemExit('HTML head missing for replay styles')
          source = source.replace('</head>', replay_style + '</head>', 1)
          old_footer = "footer.append(replayButton,statsButton);"
          if source.count(old_footer)!=1:
              raise SystemExit('Replay footer location changed; no edit applied')
          # Keep the replay action with Results heading; remove duplicate footer entry.
          source = source.replace("buttons.appendChild(menuButton);", "buttons.appendChild(replayButton);buttons.appendChild(menuButton);", 1)
          source = source.replace(old_footer, "footer.append(statsButton);", 1)
          # Reopening replay should never stack an old replay panel on top.
          source = source.replace("function replay162Open(){", "function replay162Open(){document.getElementById('replay162Panel')?.remove();", 1)
          html.write_text(source, encoding='utf-8')
          class ApprovedArt(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_art = False
                  self.src = None
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get('id') == 'approved-yellow14-icon-source':
                      self.in_art = True
                  elif self.in_art and tag == 'img':
                      self.src = attrs.get('src')
              def handle_endtag(self, tag):
                  if tag == 'div' and self.in_art:
                      self.in_art = False
          art = ApprovedArt()
          art.feed(source)
          if not art.src or not art.src.startswith('data:image/jpeg;base64,'):
              raise SystemExit('Approved yellow #14 artwork not found')
          image = base64.b64decode(art.src.split(',', 1)[1], validate=True)
          drawable = Path('android-v340/app/src/main/res/drawable-nodpi')
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / 'fidget_launcher.jpg').write_bytes(image)
          manifest = Path('android-v340/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text(encoding='utf-8')
          if '<application' not in xml:
              raise SystemExit('Android manifest application element missing')
          import re
          import xml.etree.ElementTree as ET
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest)
          root = tree.getroot()
          app = root.find('application')
          if app is None:
              raise SystemExit('Android application element missing')
          app.set('{http://schemas.android.com/apk/res/android}icon', '@drawable/fidget_launcher')
          tree.write(manifest, encoding='unicode', xml_declaration=True)
          print('Steering toggle isolated; approved artwork set as Android launcher icon')
          PY
      - name: Add Android WebView crash recovery and diagnostic logging
        run: |
          cat > android-v340/app/src/main/java/com/fidgetracing/game/MainActivity.java <<'JAVA'
          package com.fidgetracing.game;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.os.Build;
          import android.view.WindowInsets;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.util.Log;
          import android.webkit.ConsoleMessage;
          import android.webkit.RenderProcessGoneDetail;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private WebView game;
              private void openGame() {
                  game = new WebView(this);
                  FrameLayout frame = new FrameLayout(this);
                  frame.addView(game, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(frame);
                  if (Build.VERSION.SDK_INT >= 30) {
                      frame.setOnApplyWindowInsetsListener((view, insets) -> {
                          android.graphics.Insets bars = insets.getInsets(
                              WindowInsets.Type.navigationBars() | WindowInsets.Type.displayCutout());
                          FrameLayout.LayoutParams lp = (FrameLayout.LayoutParams) game.getLayoutParams();
                          lp.leftMargin = bars.left;
                          lp.topMargin = bars.top;
                          lp.rightMargin = bars.right;
                          lp.bottomMargin = bars.bottom;
                          game.setLayoutParams(lp);
                          return insets;
                      });
                      frame.requestApplyInsets();
                  }
                  WebSettings s = game.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(true);
                  game.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onConsoleMessage(ConsoleMessage message) {
                          Log.i("FidgetWebView", message.messageLevel() + " " +
                                  message.sourceId() + ":" + message.lineNumber() + " " + message.message());
                          return true;
                      }
                  });
                  game.setWebViewClient(new WebViewClient() {
                      @Override public boolean onRenderProcessGone(WebView view, RenderProcessGoneDetail detail) {
                          Log.e("FidgetWebView", "Renderer exited. Crashed=" + detail.didCrash());
                          view.destroy();
                          game = null;
                          Toast.makeText(MainActivity.this, "Game display restarting", Toast.LENGTH_SHORT).show();
                          getWindow().getDecorView().post(() -> openGame());
                          return true;
                      }
                      @Override public void onPageFinished(WebView view, String url) {
                          Log.i("FidgetWebView", "Page loaded: " + url);
                      }
                  });
                  game.loadUrl("file:///android_asset/index.html");
              }
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  openGame();
              }
              @Override public void onBackPressed() {
                  new AlertDialog.Builder(this)
                    .setMessage("Exit Fidget Racing?")
                    .setNegativeButton("Stay", (dialog, which) -> dialog.dismiss())
                    .setPositiveButton("Exit", (dialog, which) -> finish())
                    .show();
              }
              @Override protected void onDestroy() {
                  if (game != null) { game.destroy(); game = null; }
                  super.onDestroy();
              }
          }
          JAVA
      - name: Build installable debug APK
        working-directory: android-v340
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Fidget-Racing-V340-APK
          path: android-v340/app/build/outputs/apk/debug/*.apk
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.FIDGET_UPLOAD_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.FIDGET_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FIDGET_UPLOAD_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.FIDGET_UPLOAD_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::warning::Play Store signing secrets incomplete; skipping signed AAB."
            exit 0
          fi
          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fidget-upload.jks"; then
            echo "::warning::Upload keystore secret is not valid base64; skipping signed AAB."
            exit 0
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/fidget-upload.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::warning::Upload keystore could not be opened with the configured store password and alias; skipping signed AAB."
            exit 0
          fi
          echo "KEYSTORE_READY=true" >> "$GITHUB_ENV"
      - name: Build signed release AAB
        if: ${{ env.KEYSTORE_READY == 'true' }}
        working-directory: android-v340
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fidget-upload.jks
          ANDROID_KEY_ALIAS: ${{ secrets.FIDGET_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.FIDGET_UPLOAD_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.FIDGET_UPLOAD_STORE_PASSWORD }}
        run: |
          cat >> app/build.gradle <<'EOF'
          android {
            signingConfigs {
              playUpload {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_STORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
            }
            buildTypes { release { signingConfig signingConfigs.playUpload } }
          }
          EOF
          gradle bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ env.KEYSTORE_READY == 'true' }}
        with:
          name: Fidget-Racing-V340-Signed-Play-AAB
          path: android-v340/app/build/outputs/bundle/release/*.aab
