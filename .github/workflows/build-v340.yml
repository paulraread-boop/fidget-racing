name: Build Fidget Racing V340 Android
on:
  workflow_dispatch:
  push:
    branches: [build/v340-android]
    paths:
      - 'android-v340/**'
      - 'Fidget_V340_Upload_*.zip'
      - '.github/workflows/build-v340.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner already includes Android SDK command-line tools.
      # Avoid setup-android's failing SDK license/update operation.
      - name: Locate preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME" || { echo "::error::Android SDK missing on runner"; exit 1; }
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "Using Android SDK: $ANDROID_HOME"
      - name: Unpack uploaded V340 Android project
        run: |
          if [ ! -f android-v340/app/build.gradle ]; then
            for i in 1 2 3 4 5; do
              test -f "Fidget_V340_Upload_${i}.zip"
              unzip -q "Fidget_V340_Upload_${i}.zip" -d "$RUNNER_TEMP"
            done
            cat "$RUNNER_TEMP"/Fidget_V340_Android_Part_{1,2,3,4,5}.zip.part > "$RUNNER_TEMP/v340.zip"
            unzip -q "$RUNNER_TEMP/v340.zip"
          fi
      - name: Verify V340 source is present
        run: |
          test -f android-v340/app/src/main/assets/index.html || { echo "::error::Upload the V340 Android Studio source into android-v340/ first"; exit 1; }
          test -f android-v340/app/build.gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply steering toggle and approved Fidget Racing launcher artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import base64
          html = Path('android-v340/app/src/main/assets/index.html')
          source = html.read_text(encoding='utf-8')
          old = "$('side').onclick=()=>{release();rightControls=!rightControls;applySide();"
          new = "$('side').onclick=(event)=>{event.preventDefault();event.stopPropagation();release();rightControls=!rightControls;applySide();"
          if old not in source:
              raise SystemExit('Steering handler not found; refusing unrelated game edits')
          html.write_text(source.replace(old, new, 1), encoding='utf-8')
          class ApprovedArt(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_art = False
                  self.src = None
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get('id') == 'approved-yellow14-icon-source':
                      self.in_art = True
                  elif self.in_art and tag == 'img':
                      self.src = attrs.get('src')
              def handle_endtag(self, tag):
                  if tag == 'div' and self.in_art:
                      self.in_art = False
          art = ApprovedArt()
          art.feed(source)
          if not art.src or not art.src.startswith('data:image/jpeg;base64,'):
              raise SystemExit('Approved yellow #14 artwork not found')
          image = base64.b64decode(art.src.split(',', 1)[1], validate=True)
          drawable = Path('android-v340/app/src/main/res/drawable-nodpi')
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / 'fidget_launcher.jpg').write_bytes(image)
          manifest = Path('android-v340/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text(encoding='utf-8')
          if '<application' not in xml:
              raise SystemExit('Android manifest application element missing')
          import re
          import xml.etree.ElementTree as ET
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest)
          root = tree.getroot()
          app = root.find('application')
          if app is None:
              raise SystemExit('Android application element missing')
          app.set('{http://schemas.android.com/apk/res/android}icon', '@drawable/fidget_launcher')
          tree.write(manifest, encoding='unicode', xml_declaration=True)
          print('Steering toggle isolated; approved artwork set as Android launcher icon')
          PY
      - name: Add Android WebView crash recovery and diagnostic logging
        run: |
          cat > android-v340/app/src/main/java/com/fidgetracing/game/MainActivity.java <<'JAVA'
          package com.fidgetracing.game;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.os.Build;
          import android.view.WindowInsets;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.util.Log;
          import android.webkit.ConsoleMessage;
          import android.webkit.RenderProcessGoneDetail;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private WebView game;
              private void openGame() {
                  game = new WebView(this);
                  FrameLayout frame = new FrameLayout(this);
                  frame.addView(game, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(frame);
                  if (Build.VERSION.SDK_INT >= 30) {
                      frame.setOnApplyWindowInsetsListener((view, insets) -> {
                          android.graphics.Insets bars = insets.getInsets(
                              WindowInsets.Type.navigationBars() | WindowInsets.Type.displayCutout());
                          FrameLayout.LayoutParams lp = (FrameLayout.LayoutParams) game.getLayoutParams();
                          lp.leftMargin = bars.left;
                          lp.topMargin = bars.top;
                          lp.rightMargin = bars.right;
                          lp.bottomMargin = bars.bottom;
                          game.setLayoutParams(lp);
                          return insets;
                      });
                      frame.requestApplyInsets();
                  }
                  WebSettings s = game.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(true);
                  game.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onConsoleMessage(ConsoleMessage message) {
                          Log.i("FidgetWebView", message.messageLevel() + " " +
                                  message.sourceId() + ":" + message.lineNumber() + " " + message.message());
                          return true;
                      }
                  });
                  game.setWebViewClient(new WebViewClient() {
                      @Override public boolean onRenderProcessGone(WebView view, RenderProcessGoneDetail detail) {
                          Log.e("FidgetWebView", "Renderer exited. Crashed=" + detail.didCrash());
                          view.destroy();
                          game = null;
                          Toast.makeText(MainActivity.this, "Game display restarting", Toast.LENGTH_SHORT).show();
                          getWindow().getDecorView().post(() -> openGame());
                          return true;
                      }
                      @Override public void onPageFinished(WebView view, String url) {
                          Log.i("FidgetWebView", "Page loaded: " + url);
                      }
                  });
                  game.loadUrl("file:///android_asset/index.html");
              }
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  openGame();
              }
              @Override public void onBackPressed() {
                  new AlertDialog.Builder(this)
                    .setMessage("Exit Fidget Racing?")
                    .setNegativeButton("Stay", (dialog, which) -> dialog.dismiss())
                    .setPositiveButton("Exit", (dialog, which) -> finish())
                    .show();
              }
              @Override protected void onDestroy() {
                  if (game != null) { game.destroy(); game = null; }
                  super.onDestroy();
              }
          }
          JAVA
      - name: Build installable debug APK
        working-directory: android-v340
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Fidget-Racing-V340-APK
          path: android-v340/app/build/outputs/apk/debug/*.apk
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.FIDGET_UPLOAD_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.FIDGET_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FIDGET_UPLOAD_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.FIDGET_UPLOAD_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::warning::Play Store signing secrets incomplete; skipping signed AAB."
            exit 0
          fi
          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fidget-upload.jks"; then
            echo "::warning::Upload keystore secret is not valid base64; skipping signed AAB."
            exit 0
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/fidget-upload.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::warning::Upload keystore could not be opened with the configured store password and alias; skipping signed AAB."
            exit 0
          fi
          echo "KEYSTORE_READY=true" >> "$GITHUB_ENV"
      - name: Build signed release AAB
        if: ${{ env.KEYSTORE_READY == 'true' }}
        working-directory: android-v340
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fidget-upload.jks
          ANDROID_KEY_ALIAS: ${{ secrets.FIDGET_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.FIDGET_UPLOAD_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.FIDGET_UPLOAD_STORE_PASSWORD }}
        run: |
          cat >> app/build.gradle <<'EOF'
          android {
            signingConfigs {
              playUpload {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_STORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
            }
            buildTypes { release { signingConfig signingConfigs.playUpload } }
          }
          EOF
          gradle bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ env.KEYSTORE_READY == 'true' }}
        with:
          name: Fidget-Racing-V340-Signed-Play-AAB
          path: android-v340/app/build/outputs/bundle/release/*.aab
