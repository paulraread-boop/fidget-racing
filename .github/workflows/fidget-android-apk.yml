name: Fidget Racing Android APK
on:
  push:
    branches: [fix/mobile-floating-menu-fit-2026-10-18]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare original game as Android asset
        run: |
          mkdir -p app/src/main/assets
          cp FIDGET_RACING_FLOATING_MENU_YELLOW14_FINAL.html app/src/main/assets/game.html
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Fidget-Racing-Corrected-Android-APK
          path: app/build/outputs/apk/debug/*.apk
