name: Build Official Fidget Racing v60 APK
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract Android shell without modifying official game
        run: |
          mkdir -p android-project
          unzip -q FIDGET_RACING_EXIT_FIXED_SOURCE.zip -d android-project
          test -f android-project/app/build.gradle -o -f android-project/app/build.gradle.kts
      - name: Install exact approved v60 HTML
        run: |
          set -eu
          source_file=Fidget_Racing_OFFICIAL_MASTER_v60-3.html
          test -s "$source_file" || { echo "::error::Upload Fidget_Racing_OFFICIAL_MASTER_v60.html to repository root first."; exit 1; }
          mkdir -p android-project/app/src/main/assets
          cp "$source_file" android-project/app/src/main/assets/index.html
          cmp "$source_file" android-project/app/src/main/assets/index.html
          sha256sum "$source_file" android-project/app/src/main/assets/index.html
      - name: Build installable debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists
        run: test -n "$(find android-project/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: Fidget-Racing-Official-v60-Phone-APK
          retention-days: 30
          if-no-files-found: error
          path: android-project/app/build/outputs/apk/debug/*.apk
