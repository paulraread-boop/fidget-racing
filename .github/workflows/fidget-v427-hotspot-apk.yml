name: Fidget Racing V427 Hotspot APK
on:
  push:
    branches: [v427-hotspot-build]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble approved full V426 game
        run: |
          mkdir -p android-project/app/src/main/assets
          unzip -oq FIDGET_RACING_EXIT_FIXED_SOURCE.zip -d android-project
          unzip -oq V426_Part_1_Game_HTML.zip -d android-project/app/src/main/assets
          unzip -oq V426_Part_2_Images_A.zip -d android-project/app/src/main/assets
          unzip -oq V426_Part_3_Images_B.zip -d android-project/app/src/main/assets
          test -s android-project/app/src/main/assets/index.html
      - name: Require and install V427 hotspot multiplayer sources
        run: |
          set -euo pipefail
          src=v427-hotspot/app/src/main
          for f in java/com/fidgetracing/game/MainActivity.java java/com/fidgetracing/game/LocalMultiplayer.java java/com/fidgetracing/game/NativeRaceBridge.java AndroidManifest.xml; do
            test -s "$src/$f" || { echo "::error::Missing V427 source $src/$f"; exit 1; }
            mkdir -p "android-project/app/src/main/$(dirname "$f")"
            cp "$src/$f" "android-project/app/src/main/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android-project/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if 'android.permission.INTERNET' not in s: raise SystemExit("Internet permission missing")
          s=s.replace('android:usesCleartextTraffic="false"','android:usesCleartextTraffic="true"')
          p.write_text(s)
          PY
      - name: Compile V427 debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Fidget-Racing-V427-Hotspot-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
