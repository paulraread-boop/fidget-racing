<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Fidget Racing — Chat Preview</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#4b1a18,#090d18 70%);color:#fff;font:16px Arial,sans-serif}.app{max-width:450px;margin:auto;min-height:100vh;padding:24px 18px}.logo{text-align:center;font-weight:900;font-size:32px;color:#ffcc32;text-shadow:2px 3px #ad2222;letter-spacing:1px}.sub{text-align:center;color:#bbb;margin:8px 0 25px}.panel{border:2px solid #e6ae27;border-radius:18px;background:#151b2b;padding:17px;box-shadow:0 6px 22px #0009}h2{margin:0 0 12px;text-align:center}.count{text-align:center;color:#8df3aa;margin-bottom:16px}.messages{height:280px;overflow:auto;background:#090f1d;border-radius:12px;padding:12px;line-height:1.6}.msg{margin-bottom:9px}.msg b{color:#ffcf50}.compose{display:flex;gap:8px;margin-top:14px}input{min-width:0;flex:1;border-radius:8px;padding:13px;border:1px solid #666;background:#fff;color:#111}button{border:0;border-radius:9px;padding:13px 16px;font-weight:bold;background:#ffcb32;color:#181818}.back{width:100%;margin-top:18px;background:#b72d2d;color:white}.note{text-align:center;font-size:12px;color:#aaa;margin-top:14px}</style><div class="app"><div class="logo">FIDGET RACING</div><div class="sub">CHAT ROOM • UI PREVIEW</div><div class="panel"><h2>🏁 Racing Chat</h2><div class="count">● Preview only · 0 / 20 players connected</div><div class="messages" id="messages"><div class="msg"><b>System:</b> Welcome to the Fidget Racing chat preview.</div><div class="msg"><b>System:</b> Real multiplayer connection is not enabled yet.</div></div><form class="compose" id="form"><input id="message" maxlength="200" placeholder="Type a message…" aria-label="Message"><button>Send</button></form><button class="back" onclick="location.href='https://github.com/paulraread-boop/fidget-racing'">Back to Main Menu (preview)</button></div><div class="note">Visual demo only. No messages are sent over Wi-Fi, internet or Bluetooth.</div></div><script>document.getElementById('form').onsubmit=e=>{e.preventDefault();const i=document.getElementById('message');if(!i.value.trim())return;const d=document.createElement('div');d.className='msg';const b=document.createElement('b');b.textContent='You: ';d.append(b,document.createTextNode(i.value));document.getElementById('messages').append(d);i.value='';d.scrollIntoView({block:'end'});};</script></html>
